# pmbot Terraform CD (polymarket-bot CH-008). Only products/pmbot is ever planned or applied here: the
# path filters below, the working-directory, and the roles' permissions. No approval gate (owner
# decision 2026-10-01): a merge to main applies its saved plan unless ci/plan_guard.py refuses it.
#   pull_request   -> unit tests, fmt -check, validate, plan (read-only role, no lock), guard preview,
#                     PR comment.
#   push to main   -> unit tests, fmt -check, validate, plan -out, guard, apply that saved plan.
# Auth: GitHub OIDC (pmbot-github-terraform-plan for PRs, pmbot-github-terraform for main). No secrets;
# the PR comment uses the automatic per-run github.token. A refused or failed apply fails the run, and
# GitHub's failed-run notification is the alert; the owner then applies by hand (products/pmbot/README.md).
name: pmbot-terraform

on:
  pull_request:
    paths:
      - "products/pmbot/**"
      - ".github/workflows/pmbot-terraform.yml"
  push:
    branches: [main]
    paths:
      - "products/pmbot/**"
      - ".github/workflows/pmbot-terraform.yml"

permissions:
  contents: read

concurrency:
  group: pmbot-terraform-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash
    working-directory: products/pmbot

env:
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Plan guard unit tests
        run: python3 -m unittest discover -s ci -p "test_*.py"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd  # v3
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: fmt -check
        run: terraform fmt -check -recursive

      - name: Configure AWS credentials (OIDC, read-only plan role)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a  # v4
        with:
          role-to-assume: ${{ vars.PMBOT_TF_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: init
        run: terraform init -input=false -lockfile=readonly

      - name: validate
        run: terraform validate -no-color

      - name: plan
        id: plan
        run: |
          set +e
          terraform plan -input=false -lock=false -no-color -detailed-exitcode -out=tfplan > plan.txt 2>&1
          code=$?
          set -e
          cat plan.txt
          echo "exitcode=${code}" >> "${GITHUB_OUTPUT}"
          if [ "${code}" -eq 1 ]; then exit 1; fi

      - name: Guard preview (what a merge would do)
        id: guard
        if: steps.plan.outputs.exitcode == '2'
        run: |
          set +e
          terraform show -json tfplan > plan.json
          python3 ci/plan_guard.py plan.json > guard.md
          code=$?
          set -e
          cat guard.md
          echo "exitcode=${code}" >> "${GITHUB_OUTPUT}"

      - name: Comment the plan on the PR
        if: always() && steps.plan.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          {
            echo "### products/pmbot plan"
            echo
            if [ -f guard.md ]; then cat guard.md; echo; fi
            echo '```'
            head -c 60000 plan.txt
            echo
            echo '```'
          } > comment.md
          gh pr comment "${PR_NUMBER}" --body-file comment.md

      - name: Fail the check if a merge would be refused
        if: steps.guard.outputs.exitcode != '' && steps.guard.outputs.exitcode != '0'
        run: |
          echo "::error::plan_guard refuses this plan: merging it will NOT apply (see the PR comment)."
          exit 1

      - name: Remove the plan files
        if: always()
        run: rm -f tfplan plan.json

  apply:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Plan guard unit tests
        run: python3 -m unittest discover -s ci -p "test_*.py"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd  # v3
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false

      - name: fmt -check
        run: terraform fmt -check -recursive

      - name: Configure AWS credentials (OIDC, apply role)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a  # v4
        with:
          role-to-assume: ${{ vars.PMBOT_TF_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: init
        run: terraform init -input=false -lockfile=readonly

      - name: validate
        run: terraform validate -no-color

      - name: plan -out
        id: plan
        run: |
          set +e
          terraform plan -input=false -no-color -detailed-exitcode -out=tfplan
          code=$?
          set -e
          echo "exitcode=${code}" >> "${GITHUB_OUTPUT}"
          if [ "${code}" -eq 1 ]; then exit 1; fi
          if [ "${code}" -eq 0 ]; then echo "No changes: nothing to apply." >> "${GITHUB_STEP_SUMMARY}"; fi

      - name: Safety check (guarded deletes/replaces, CD roles, live-trading variables)
        if: steps.plan.outputs.exitcode == '2'
        run: |
          set -uo pipefail
          terraform show -json tfplan > plan.json
          code=0; python3 ci/plan_guard.py plan.json > guard.md || code=$?
          cat guard.md
          cat guard.md >> "${GITHUB_STEP_SUMMARY}"
          if [ "${code}" -ne 0 ]; then
            echo "::error::plan_guard REFUSED the plan; nothing was applied. The owner applies by hand from a saved plan (products/pmbot/README.md)."
            exit 1
          fi

      - name: apply the saved plan
        if: steps.plan.outputs.exitcode == '2'
        run: terraform apply -input=false -no-color tfplan

      - name: Remove the plan files
        if: always()
        run: rm -f tfplan plan.json
